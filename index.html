<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Camera App</title>
    <!-- Подключаем стили и скрипты MediaPipe Hands -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0b14;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        .container {
            position: relative;
            width: 100%;
            max-width: 480px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        video, canvas {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* Зеркальное отображение камеры */
        }
        .ui-layer {
            position: absolute;
            z-index: 10;
            top: 20px;
            display: flex;
            gap: 10px;
        }
        button {
            background: #2ea6ff;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        button:active {
            transform: scale(0.95);
        }
        #status {
            position: absolute;
            bottom: 30px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="ui-layer">
        <button id="startBtn">Включить камеру</button>
    </div>
    
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="output_canvas"></canvas>
    
    <div id="status">Камера отключена</div>
</div>

<script>
    const videoElement = document.getElementById('webcam');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const startBtn = document.getElementById('startBtn');
    const statusDiv = document.getElementById('status');

    let camera = null;

    function onResults(results) {
        // Установка размеров холста под видео
        canvasElement.width = videoElement.videoWidth;
        canvasElement.height = videoElement.videoHeight;

        canvasCtx.save();
        canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
        canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

        // Если найдены руки — рисуем скелет
        if (results.multiHandLandmarks) {
            for (const landmarks of results.multiHandLandmarks) {
                drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, {color: '#00FF00', lineWidth: 3});
                drawLandmarks(canvasCtx, landmarks, {color: '#FF0000', lineWidth: 1, radius: 3});
            }
            statusDiv.innerText = `Рук обнаружено: ${results.multiHandLandmarks.length}`;
        } else {
            statusDiv.innerText = "Ищем руки в кадре...";
        }
        canvasCtx.restore();
    }

    // Инициализация нейросети MediaPipe Hands
    const hands = new Hands({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
        maxNumHands: 2,
        modelComplexity: 0, // 0 — быстрая модель (убирает лаги на телефонах)
        minDetectionConfidence: 0.6,
        minTrackingConfidence: 0.6
    });

    hands.onResults(onResults);

    startBtn.addEventListener('click', async () => {
        try {
            startBtn.style.display = 'none';
            statusDiv.innerText = "Запуск камеры...";

            // Настройка для стабильной работы на мобильных устройствах
            camera = new Camera(videoElement, {
                onFrame: async () => {
                    await hands.send({ image: videoElement });
                },
                width: 640,
                height: 480
            });

            await camera.start();
            statusDiv.innerText = "Камера работает!";
        } catch (error) {
            console.error(error);
            alert("Не удалось получить доступ к камере. Убедитесь, что страница открыта через HTTPS.");
            startBtn.style.display = 'block';
            statusDiv.innerText = "Ошибка доступа к камере";
        }
    });
</script>

<!-- Дополнительные скрипты для отрисовки скелета рук -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>

</body>
</html>
