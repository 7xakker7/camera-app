<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Аня — Gestures & Particles Portfolio</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0b14;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        .container {
            position: relative;
            width: 100%;
            max-width: 480px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        video, canvas {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }
        .ui-layer {
            position: absolute;
            z-index: 10;
            top: 20px;
            display: flex;
            gap: 10px;
        }
        button {
            background: #ff2ea6;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        #status {
            position: absolute;
            bottom: 30px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            border: 1px solid rgba(255,255,255,0.2);
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="ui-layer">
        <button id="startBtn">Включить Аню</button>
    </div>
    
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="output_canvas"></canvas>
    
    <div id="status">Нажми кнопку для запуска камеры</div>
</div>

<script>
    const videoElement = document.getElementById('webcam');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const startBtn = document.getElementById('startBtn');
    const statusDiv = document.getElementById('status');

    let camera = null;
    let particles = [];

    // Класс для летающих частиц (сердечки и т.д.)
    class Particle {
        constructor(x, y, text) {
            this.x = x;
            this.y = y;
            this.text = text;
            this.size = Math.random() * 20 + 20;
            this.speedX = (Math.random() - 0.5) * 4;
            this.speedY = Math.random() * -4 - 2;
            this.alpha = 1;
        }
        update() {
            this.x += this.speedX;
            this.y += this.speedY;
            this.alpha -= 0.02;
        }
        draw(ctx) {
            ctx.save();
            ctx.globalAlpha = Math.max(this.alpha, 0);
            ctx.font = `${this.size}px Arial`;
            ctx.fillText(this.text, this.x, this.y);
            ctx.restore();
        }
    }

    function onResults(results) {
        canvasElement.width = videoElement.videoWidth || 640;
        canvasElement.height = videoElement.videoHeight || 480;

        canvasCtx.save();
        canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
        canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

        if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
            for (const landmarks of results.multiHandLandmarks) {
                drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, {color: '#ff2ea6', lineWidth: 3});
                drawLandmarks(canvasCtx, landmarks, {color: '#ffffff', lineWidth: 1, radius: 4});

                // Берем координаты кончика указательного пальца (индекс 8) для спавна частиц
                const indexFinger = landmarks[8];
                const x = indexFinger.x * canvasElement.width;
                const y = indexFinger.y * canvasElement.height;

                // Спавним сердечко при движении руки
                if (Math.random() < 0.3) {
                    particles.push(new Particle(x, y, '💖'));
                }
            }
            statusDiv.innerText = "✨ Аня: Жесты активны!";
        } else {
            statusDiv.innerText = "✨ Аня: Покажите руку в кадр";
        }

        // Рендерим и обновляем частицы
        for (let i = particles.length - 1; i >= 0; i--) {
            particles[i].update();
            particles[i].draw(canvasCtx);
            if (particles[i].alpha <= 0) {
                particles.splice(i, 1);
            }
        }

        canvasCtx.restore();
    }

    const hands = new Hands({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
        maxNumHands: 1,
        modelComplexity: 1,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
    });

    hands.onResults(onResults);

    startBtn.addEventListener('click', async () => {
        try {
            startBtn.style.display = 'none';
            statusDiv.innerText = "Запуск камеры Ани...";

            camera = new Camera(videoElement, {
                onFrame: async () => {
                    await hands.send({ image: videoElement });
                },
                width: 640,
                height: 480
            });

            await camera.start();
        } catch (error) {
            console.error(error);
            alert("Ошибка камеры.");
            startBtn.style.display = 'block';
            statusDiv.innerText = "Ошибка запуска";
        }
    });
</script>

</body>
</html>
